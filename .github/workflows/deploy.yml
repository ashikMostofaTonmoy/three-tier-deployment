name: Build and deploy frontend

# Runs on every push to main that touches the app, and on demand from the
# Actions tab. No AWS keys are stored anywhere: the job asks GitHub for a
# short-lived OIDC token and trades it for temporary AWS credentials.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the static site
        working-directory: frontend
        run: |
          npm ci
          export BUILD_ID="${GITHUB_SHA::7}-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          npm run build
          tar -C dist -czf ../dist.tgz .

      - name: Show OIDC token claims (debug)
        run: |
          PAYLOAD=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value' | cut -d. -f2)
          # pad and decode
          python3 -c "import base64,sys,json; s=sys.argv[1]; s+='='*(-len(s)%4); print(json.dumps({k:json.loads(base64.urlsafe_b64decode(s))[k] for k in ('sub','aud','repository','repository_owner','ref')}, indent=2))" "$PAYLOAD"

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Stage the build in S3
        run: |
          aws s3 cp dist.tgz "s3://${{ vars.DEPLOY_BUCKET }}/releases/${GITHUB_SHA}.tgz"

      - name: Tell the instance to go live (SSM)
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          read -r -d '' REMOTE <<EOF || true
          set -e
          RELEASE=/var/www/three-tier/releases/\$(date -u +%Y%m%d%H%M%S)
          sudo mkdir -p "\$RELEASE"
          aws s3 cp "s3://${BUCKET}/releases/${GITHUB_SHA}.tgz" /tmp/release.tgz
          sudo tar -C "\$RELEASE" -xzf /tmp/release.tgz && rm -f /tmp/release.tgz
          sudo ln -sfn "\$RELEASE" /var/www/three-tier/current
          sudo nginx -t && sudo systemctl reload nginx
          cd /var/www/three-tier/releases && ls -1dt */ | tail -n +6 | xargs -r sudo rm -rf
          echo "current -> \$(readlink -f /var/www/three-tier/current)"
          EOF

          jq -n --arg c "$REMOTE" '{commands: ($c | split("\n"))}' > params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          for _ in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ] && break
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "final status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify it is serving the new build
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "instance: http://$IP/"
          curl -sf -o /dev/null -w 'GET /        -> %{http_code}\n' "http://$IP/"
          curl -sf -o /dev/null -w 'GET /api/... -> %{http_code}\n' \
            "http://$IP/api/v1/forecast?latitude=1.35&longitude=103.82&current=temperature_2m&timezone=auto"
          JS=$(curl -s "http://$IP/" | grep -o 'assets/index-[^"]*\.js')
          curl -s "http://$IP/$JS" | grep -q "$BUILD_ID" \
            && echo "live build -> $BUILD_ID  ✅" \
            || { echo "instance is not serving $BUILD_ID"; exit 1; }

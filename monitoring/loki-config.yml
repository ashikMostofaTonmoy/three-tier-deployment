# Loki, single-process mode: everything (ingest, storage, query) in one
# binary, storing chunks on local disk under /var/lib/loki. Fine for a class
# VM; a real deployment would use object storage (S3) and run Loki's
# components separately so they scale independently.
auth_enabled: false

server:
  http_listen_port: 3100
  http_listen_address: 127.0.0.1 # never touches the security group — see README §36
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h # 7 days — plenty for a short-lived class VM

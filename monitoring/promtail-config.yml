# Promtail: tails log FILES already on disk and pushes new lines to Loki. It
# doesn't generate logs itself — PM2 (for the backend) and Nginx were already
# writing these files; Promtail just follows them, the same idea as `tail -f`
# but shipping every new line onward instead of printing it.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  # The backend's own structured (JSON, via pino) stdout logs, captured by
  # PM2 into ~/.pm2/logs/. Parsed so "level" becomes a Loki label you can
  # filter on (e.g. show only level=50, pino's numeric code for "error").
  - job_name: backend
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          __path__: /home/ubuntu/.pm2/logs/backend-out-*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:

  - job_name: backend-errors
    static_configs:
      - targets: [localhost]
        labels:
          job: backend
          stream: stderr
          __path__: /home/ubuntu/.pm2/logs/backend-error-*.log

  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          log_type: access
          __path__: /var/log/nginx/access.log

  - job_name: nginx-error
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          log_type: error
          __path__: /var/log/nginx/error.log

# =============================================================================
#  Nginx site config for the FULL three-tier stack (frontend + backend + db,
#  all on this one VM). Compare with nginx/three-tier.conf (Part 1) — the only
#  real difference is what /api/ proxies to: there it's Open-Meteo directly,
#  here it's our own backend on localhost:3000.
#  Lives on the server at: /etc/nginx/sites-available/three-tier
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/three-tier/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tier 2 (backend) is on the SAME machine, plain HTTP, not exposed by the
    # security group at all — only Nginx (via localhost) can reach it.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

# =============================================================================
#  Nginx site config for Part 5/6 (real VPC networking) — the frontend and
#  backend are now on SEPARATE instances, so /api/ proxies to the backend's
#  PRIVATE IP over the network, not http://127.0.0.1 like Parts 2-4's
#  single-VM config. scripts/deploy-frontend-vpc.sh replaces the literal
#  text BACKEND_PRIVATE_IP below with the real address before installing this.
# =============================================================================

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/three-tier/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://BACKEND_PRIVATE_IP:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The ALB's target group (Class 6) health-checks this path — it must
    # answer without depending on the backend, so a backend outage doesn't
    # also make the ALB mark the frontend unhealthy and pull it from rotation.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

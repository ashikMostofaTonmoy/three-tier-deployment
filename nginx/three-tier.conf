# =============================================================================
#  Nginx site config for the Weather Board frontend (Tier 1).
#  On the server this file lives at: /etc/nginx/sites-available/three-tier
#  and is symlinked into:            /etc/nginx/sites-enabled/three-tier
# =============================================================================

server {
    listen 80 default_server;
    server_name _;                       # "_" = match any hostname

    # ---- Serve the built React app ------------------------------------------
    # "current" is a symlink that points at the release we want live.
    # Swapping that symlink is how a deploy goes live instantly (see scripts/deploy.sh).
    root  /var/www/three-tier/current;
    index index.html;

    # Any real file (JS, CSS, images) is served as-is. Anything else falls back
    # to index.html so the React app can handle the route itself instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Reverse-proxy the weather API ------------------------------------
    # The browser calls /api/v1/forecast?... on THIS server. Nginx forwards it to
    # https://api.open-meteo.com/v1/forecast?... The browser never learns the real
    # API host, so there is no CORS problem and no API URL baked into the frontend.
    location /api/ {
        # api.open-meteo.com sits behind a CDN whose IPs change, so resolve the
        # name at request time using the machine's local DNS resolver.
        resolver 127.0.0.53 valid=30s;
        set $upstream "api.open-meteo.com";

        # The trailing slash on proxy_pass strips the "/api/" prefix:
        #   /api/v1/forecast  ->  https://api.open-meteo.com/v1/forecast
        proxy_pass https://$upstream/;

        proxy_ssl_server_name on;                 # send SNI so TLS works
        proxy_set_header Host $upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Tiny health endpoint for load balancers / uptime checks ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
